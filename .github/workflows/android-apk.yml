name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install
      - run: bash scripts/build-android.sh
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bisim-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 android/app/build/outputs/apk/debug/app-debug.apk --clobber || true
          gh release upload v1.0.0 android/app/build/outputs/apk/debug/app-debug.apk#offline-walkie-talkie.apk --clobber || true
          gh release create v1.2.0 android/app/build/outputs/apk/debug/app-debug.apk --title "Offline Walkie Talkie v1.2.0" --notes "Features: Live 4-Part Telemetry (Socket, Peer, TX, RX), Wi-Fi & Hotspot Scanner with Direct System Settings, Group Code Creation & Search, Native AudioRecord/AudioTrack Engine and Parallel Subnet Sweep." --clobber || gh release upload v1.2.0 android/app/build/outputs/apk/debug/app-debug.apk --clobber || true
      - name: Update apk-direct branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin apk-direct || true
          git checkout -B apk-direct
          cp android/app/build/outputs/apk/debug/app-debug.apk offline-walkie-talkie.apk
          git add offline-walkie-talkie.apk
          git commit -m "Update offline-walkie-talkie.apk v1.2.0" || true
          git push origin apk-direct --force || true
